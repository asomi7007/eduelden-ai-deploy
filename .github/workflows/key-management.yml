name: Key Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - verify-access
          - disable-all
          - enable-all
          - regenerate-all
          - disable-student
          - enable-student
          - regenerate-student
      student_id:
        description: 'Student ID (for single student actions, e.g., 01)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  manage-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "$AZURE_CREDENTIALS" | az login --service-principal \
            --username $(echo "$AZURE_CREDENTIALS" | jq -r .clientId) \
            --password $(echo "$AZURE_CREDENTIALS" | jq -r .clientSecret) \
            --tenant $(echo "$AZURE_CREDENTIALS" | jq -r .tenantId)

      - name: Execute key management
        run: |
          RG="${{ vars.RG_NAME || 'rg-eduelden-hub' }}"
          APIM="${{ vars.APIM_NAME || 'apim-eduelden-ai-v2' }}"
          ACTION="${{ github.event.inputs.action }}"
          SID="${{ github.event.inputs.student_id }}"
          SUBSCRIPTION_ID=$(az account show --query id --output tsv)
          APIM_URL="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.ApiManagement/service/$APIM"

          case "$ACTION" in
            verify-access)
              az rest --method GET --url "$APIM_URL?api-version=2024-05-01" \
                --query "{name:name, sku:sku.name}" --output table
              COUNT=$(az rest --method GET \
                --url "$APIM_URL/subscriptions?api-version=2024-05-01" \
                --query "length(value)" --output tsv)
              echo "Azure access verified; APIM subscriptions visible: $COUNT"
              ;;
            disable-all)
              for i in $(seq -w 1 50); do
                az rest --method PATCH \
                  --url "$APIM_URL/subscriptions/sub-student-$i?api-version=2024-05-01" \
                  --headers "If-Match=*" \
                  --body '{"properties":{"state":"suspended"}}' --output none
                echo "Disabled sub-student-$i"
              done
              ;;
            enable-all)
              for i in $(seq -w 1 50); do
                az rest --method PATCH \
                  --url "$APIM_URL/subscriptions/sub-student-$i?api-version=2024-05-01" \
                  --headers "If-Match=*" \
                  --body '{"properties":{"state":"active"}}' --output none
                echo "Enabled sub-student-$i"
              done
              ;;
            regenerate-all)
              for i in $(seq -w 1 50); do
                az rest --method POST \
                  --url "$APIM_URL/subscriptions/sub-student-$i/regeneratePrimaryKey?api-version=2024-05-01" \
                  --output none
                echo "Regenerated sub-student-$i"
              done
              ;;
            disable-student)
              [ -z "$SID" ] && echo "Student ID required" && exit 1
              az rest --method PATCH \
                --url "$APIM_URL/subscriptions/sub-student-$SID?api-version=2024-05-01" \
                --headers "If-Match=*" \
                --body '{"properties":{"state":"suspended"}}' --output none
              ;;
            enable-student)
              [ -z "$SID" ] && echo "Student ID required" && exit 1
              az rest --method PATCH \
                --url "$APIM_URL/subscriptions/sub-student-$SID?api-version=2024-05-01" \
                --headers "If-Match=*" \
                --body '{"properties":{"state":"active"}}' --output none
              ;;
            regenerate-student)
              [ -z "$SID" ] && echo "Student ID required" && exit 1
              az rest --method POST \
                --url "$APIM_URL/subscriptions/sub-student-$SID/regeneratePrimaryKey?api-version=2024-05-01" \
                --output none
              echo "Regenerated key for sub-student-$SID"
              echo "⚠️ Student must receive the new key. Run the onboarding workflow or manually send the key."
              ;;
          esac
