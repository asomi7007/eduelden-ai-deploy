name: Key Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - disable-all
          - enable-all
          - regenerate-all
          - disable-student
          - enable-student
          - regenerate-student
      student_id:
        description: 'Student ID (for single student actions, e.g., 01)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  manage-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "$AZURE_CREDENTIALS" | az login --service-principal \
            --username $(echo "$AZURE_CREDENTIALS" | jq -r .clientId) \
            --password $(echo "$AZURE_CREDENTIALS" | jq -r .clientSecret) \
            --tenant $(echo "$AZURE_CREDENTIALS" | jq -r .tenantId)

      - name: Execute key management
        run: |
          RG="${{ vars.RG_NAME || 'rg-powerplatform-billing' }}"
          APIM="${{ vars.APIM_NAME || 'apim-eduelden-ai' }}"
          ACTION="${{ github.event.inputs.action }}"
          SID="${{ github.event.inputs.student_id }}"

          case "$ACTION" in
            disable-all)
              for i in $(seq -w 1 50); do
                az apim subscription update --resource-group "$RG" --service-name "$APIM" \
                  --subscription-id "sub-student-$i" --state suspended --output none
                echo "Disabled sub-student-$i"
              done
              ;;
            enable-all)
              for i in $(seq -w 1 50); do
                az apim subscription update --resource-group "$RG" --service-name "$APIM" \
                  --subscription-id "sub-student-$i" --state active --output none
                echo "Enabled sub-student-$i"
              done
              ;;
            regenerate-all)
              for i in $(seq -w 1 50); do
                az apim subscription keys regenerate-primary-key --resource-group "$RG" \
                  --service-name "$APIM" --subscription-id "sub-student-$i" --output none
                echo "Regenerated sub-student-$i"
              done
              ;;
            disable-student)
              [ -z "$SID" ] && echo "Student ID required" && exit 1
              az apim subscription update --resource-group "$RG" --service-name "$APIM" \
                --subscription-id "sub-student-$SID" --state suspended
              ;;
            enable-student)
              [ -z "$SID" ] && echo "Student ID required" && exit 1
              az apim subscription update --resource-group "$RG" --service-name "$APIM" \
                --subscription-id "sub-student-$SID" --state active
              ;;
            regenerate-student)
              [ -z "$SID" ] && echo "Student ID required" && exit 1
              az apim subscription keys regenerate-primary-key --resource-group "$RG" \
                --service-name "$APIM" --subscription-id "sub-student-$SID" --output none
              echo "Regenerated key for sub-student-$SID"
              echo "⚠️ Student must receive the new key. Run the onboarding workflow or manually send the key."
              ;;
          esac
