name: Student Onboarding

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  onboard:
    if: contains(github.event.issue.labels.*.name, 'onboarding')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse student info from issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const idMatch = body.match(/학생\s*번호[:\s]*(\d{2})/);
            const emailMatch = body.match(/이메일[:\s]*([\w.+-]+@[\w-]+\.[\w.]+)/);
            if (!idMatch) {
              core.setFailed('학생 번호를 찾을 수 없습니다');
              return;
            }
            core.setOutput('student_id', idMatch[1]);
            core.setOutput('student_email', emailMatch ? emailMatch[1] : `${idMatch[1]}@eduelden.kr`);

      - name: Get APIM subscription key
        id: key
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "$AZURE_CREDENTIALS" | az login --service-principal \
            --username $(echo "$AZURE_CREDENTIALS" | jq -r .clientId) \
            --password $(echo "$AZURE_CREDENTIALS" | jq -r .clientSecret) \
            --tenant $(echo "$AZURE_CREDENTIALS" | jq -r .tenantId)

          SID="sub-student-${{ steps.parse.outputs.student_id }}"
          KEYS=$(az apim subscription keys list \
            --resource-group rg-powerplatform-billing \
            --service-name apim-eduelden-ai \
            --subscription-id "$SID" \
            --output json)
          PK=$(echo "$KEYS" | jq -r '.primaryKey')
          echo "::add-mask::$PK"
          echo "primary_key=$PK" >> "$GITHUB_OUTPUT"

      - name: Send welcome email via Graph API
        env:
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          TOKEN=$(curl -s -X POST \
            "https://login.microsoftonline.com/$GRAPH_TENANT_ID/oauth2/v2.0/token" \
            -d "client_id=$GRAPH_CLIENT_ID" \
            -d "client_secret=$GRAPH_CLIENT_SECRET" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials" | jq -r '.access_token')

          STUDENT_EMAIL="${{ steps.parse.outputs.student_email }}"
          STUDENT_ID="${{ steps.parse.outputs.student_id }}"
          API_KEY="${{ steps.key.outputs.primary_key }}"
          APIM_URL="https://apim-eduelden-ai.azure-api.net"

          cat > /tmp/email.json << EMAILEOF
          {
            "message": {
              "subject": "[AI 실습] 학생 ${STUDENT_ID}번 환경 설정 안내",
              "body": {
                "contentType": "HTML",
                "content": "<h2>Azure AI Foundry 바이브코딩 실습</h2><p>안녕하세요, ${STUDENT_ID}번 학생!</p><p><b>API 설정 정보:</b></p><ul><li>Base URL: ${APIM_URL}/openai</li><li>API Key: ${API_KEY}</li><li>모델: gpt-54-mini (기본), gpt-55 (고품질), deepseek-v4-flash (대안)</li></ul><p><b>설정 방법:</b></p><ol><li>PowerShell 관리자 모드로 실행</li><li><code>irm https://raw.githubusercontent.com/asomi7007/eduelden-ai-deploy/main/scripts/setup-student.ps1 | iex</code></li><li>또는 수동으로 VS Code + Cline 확장 설치 후 API 설정</li></ol>"
              },
              "toRecipients": [{"emailAddress": {"address": "${STUDENT_EMAIL}"}}]
            }
          }
          EMAILEOF

          curl -s -X POST \
            "https://graph.microsoft.com/v1.0/users/$SENDER_EMAIL/sendMail" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/email.json

          echo "Email sent to $STUDENT_EMAIL"

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ 온보딩 완료!\n\n- 학생 번호: ${{ steps.parse.outputs.student_id }}\n- 이메일 발송: ${{ steps.parse.outputs.student_email }}\n- APIM 구독: sub-student-${{ steps.parse.outputs.student_id }}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['onboarding', 'done']
            });
