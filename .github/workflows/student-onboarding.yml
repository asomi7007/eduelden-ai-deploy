name: Student Onboarding

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  onboard:
    if: contains(github.event.issue.labels.*.name, 'onboarding')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify passcode and parse student info
        id: parse
        env:
          CLASS_PASSCODE: ${{ secrets.CLASS_PASSCODE }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            // 구조화된 필드 파싱 (프론트엔드에서 전송)
            const passcodeMatch = body.match(/PASSCODE:\s*(.+)/);
            const idMatch = body.match(/STUDENT_ID:\s*(\d{2})/);
            const emailMatch = body.match(/EMAIL:\s*([\w.+-]+@[\w.-]+\.\w+)/);

            const submitted = passcodeMatch ? passcodeMatch[1].trim() : '';
            if (!submitted || submitted !== process.env.CLASS_PASSCODE) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 패스코드가 올바르지 않습니다.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('패스코드 불일치');
              return;
            }

            if (!idMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 학생 번호(01~50)를 확인해주세요.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('학생 번호 없음');
              return;
            }

            const studentId = idMatch[1];
            const num = parseInt(studentId);
            if (num < 1 || num > 50) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 학생 번호는 01~50 사이여야 합니다.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('학생 번호 범위 초과');
              return;
            }

            if (!emailMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 유효한 이메일 주소를 입력해주세요.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('이메일 없음');
              return;
            }

            core.setOutput('student_id', studentId);
            core.setOutput('student_email', emailMatch[1].trim());

      - name: Get APIM subscription key
        id: key
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "$AZURE_CREDENTIALS" | az login --service-principal \
            --username $(echo "$AZURE_CREDENTIALS" | jq -r .clientId) \
            --password $(echo "$AZURE_CREDENTIALS" | jq -r .clientSecret) \
            --tenant $(echo "$AZURE_CREDENTIALS" | jq -r .tenantId)

          SID="sub-student-${{ steps.parse.outputs.student_id }}"
          KEYS=$(az rest --method POST \
            --url "https://management.azure.com/subscriptions/3354f2f5-e261-49af-9ead-2c6938f447a3/resourceGroups/rg-powerplatform-billing/providers/Microsoft.ApiManagement/service/apim-eduelden-ai/subscriptions/${SID}/listSecrets?api-version=2022-08-01" \
            --output json)
          PK=$(echo "$KEYS" | jq -r '.primaryKey')
          echo "::add-mask::$PK"
          echo "primary_key=$PK" >> "$GITHUB_OUTPUT"

      - name: Send welcome email via Graph API
        env:
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          TOKEN=$(curl -s -X POST \
            "https://login.microsoftonline.com/$GRAPH_TENANT_ID/oauth2/v2.0/token" \
            -d "client_id=$GRAPH_CLIENT_ID" \
            -d "client_secret=$GRAPH_CLIENT_SECRET" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials" \
            -d "grant_type=client_credentials" | jq -r '.access_token')

          STUDENT_EMAIL="${{ steps.parse.outputs.student_email }}"
          STUDENT_ID="${{ steps.parse.outputs.student_id }}"
          API_KEY="${{ steps.key.outputs.primary_key }}"
          APIM_URL="https://apim-eduelden-ai.azure-api.net"
          AZURE_ACCOUNT="${STUDENT_ID}@eduelden.kr"
          AZURE_PASSWORD='!!ed7788'

          EMAIL_HTML="<div style='font-family:Pretendard,sans-serif;max-width:640px;margin:auto'>"
          EMAIL_HTML+="<h2 style='color:#1a56db'>🚀 Azure AI Foundry 바이브코딩 실습</h2>"
          EMAIL_HTML+="<p>안녕하세요, <b>${STUDENT_ID}번</b> 학생!</p><hr/>"

          EMAIL_HTML+="<h3>👤 Azure 계정 정보</h3>"
          EMAIL_HTML+="<table border='1' cellpadding='8' style='border-collapse:collapse;width:100%'>"
          EMAIL_HTML+="<tr style='background:#f0f7ff'><td><b>계정</b></td><td><code>${AZURE_ACCOUNT}</code></td></tr>"
          EMAIL_HTML+="<tr><td><b>초기 비밀번호</b></td><td><code>${AZURE_PASSWORD}</code></td></tr>"
          EMAIL_HTML+="</table>"
          EMAIL_HTML+="<p style='color:#dc2626;font-size:0.9em'>⚠️ 첫 로그인 시 비밀번호를 변경해야 합니다.</p>"

          EMAIL_HTML+="<h3>🔑 API 설정 정보</h3>"
          EMAIL_HTML+="<table border='1' cellpadding='8' style='border-collapse:collapse;width:100%'>"
          EMAIL_HTML+="<tr style='background:#f0fdf4'><td><b>Base URL</b></td><td><code>${APIM_URL}/openai/v1</code></td></tr>"
          EMAIL_HTML+="<tr><td><b>API Key</b></td><td><code>${API_KEY}</code></td></tr>"
          EMAIL_HTML+="<tr><td><b>기본 모델</b></td><td><code>gpt-54-mini</code></td></tr>"
          EMAIL_HTML+="</table>"

          EMAIL_HTML+="<h3>⚡ 자동 설정 (권장)</h3>"
          EMAIL_HTML+="<p>PowerShell을 <b>관리자 모드</b>로 열고 아래 복사-붙여넣기:</p>"
          EMAIL_HTML+="<pre style='background:#1e293b;color:#e2e8f0;padding:12px;border-radius:8px;overflow-x:auto'>"
          EMAIL_HTML+="powershell -ExecutionPolicy Bypass -Command \". ./setup-student.ps1 -StudentId ${STUDENT_ID} -ApiKey '${API_KEY}'\"</pre>"

          EMAIL_HTML+="<h3>🔄 모델 변경</h3>"
          EMAIL_HTML+="<table border='1' cellpadding='6' style='border-collapse:collapse;width:100%'>"
          EMAIL_HTML+="<tr style='background:#f8fafc'><th>모델</th><th>Model ID</th><th>특징</th></tr>"
          EMAIL_HTML+="<tr><td>GPT-5.4-mini</td><td><code>gpt-54-mini</code></td><td>범용, 빠름 ⭐기본</td></tr>"
          EMAIL_HTML+="<tr><td>GPT-5.5</td><td><code>gpt-55</code></td><td>고품질, 느림</td></tr>"
          EMAIL_HTML+="<tr><td>DeepSeek</td><td><code>deepseek-v4-flash</code></td><td>대안 모델</td></tr>"
          EMAIL_HTML+="</table></div>"

          jq -n --arg subj "[AI 실습] 학생 ${STUDENT_ID}번 환경 설정 안내" \
                 --arg html "$EMAIL_HTML" \
                 --arg to "$STUDENT_EMAIL" \
            '{message:{subject:$subj,body:{contentType:"HTML",content:$html},toRecipients:[{emailAddress:{address:$to}}]}}' \
            > /tmp/email.json

          HTTP_CODE=$(curl -s -o /tmp/email-resp.txt -w "%{http_code}" -X POST \
            "https://graph.microsoft.com/v1.0/users/$SENDER_EMAIL/sendMail" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/email.json)

          if [ "$HTTP_CODE" = "202" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "Email sent to $STUDENT_EMAIL (HTTP $HTTP_CODE)"
          else
            echo "Email send failed (HTTP $HTTP_CODE)"
            cat /tmp/email-resp.txt
            exit 1
          fi

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ 온보딩 완료!\n\n- 학생 번호: ${{ steps.parse.outputs.student_id }}\n- 이메일 발송: ${{ steps.parse.outputs.student_email }}\n- Azure 계정: ${{ steps.parse.outputs.student_id }}@eduelden.kr\n- APIM 구독: sub-student-${{ steps.parse.outputs.student_id }}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['onboarding', 'done']
            });
