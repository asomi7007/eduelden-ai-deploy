name: Student Onboarding

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  onboard:
    if: contains(github.event.issue.labels.*.name, 'onboarding')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify passcode and parse student info
        id: parse
        env:
          CLASS_PASSCODE: ${{ secrets.CLASS_PASSCODE }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            const passcodeMatch = body.match(/PASSCODE:\s*(.+)/);
            const idMatch = body.match(/STUDENT_ID:\s*(\d{2})/);
            const emailMatch = body.match(/EMAIL:\s*([\w.+-]+@[\w.-]+\.\w+)/);

            const submitted = passcodeMatch ? passcodeMatch[1].trim() : '';
            if (!submitted || submitted !== process.env.CLASS_PASSCODE) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 패스코드가 올바르지 않습니다.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('패스코드 불일치');
              return;
            }

            if (!idMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 학생 번호(01~50)를 확인해주세요.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('학생 번호 없음');
              return;
            }

            const studentId = idMatch[1];
            const num = parseInt(studentId);
            if (num < 1 || num > 50) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 학생 번호는 01~50 사이여야 합니다.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('학생 번호 범위 초과');
              return;
            }

            if (!emailMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 유효한 이메일 주소를 입력해주세요.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('이메일 없음');
              return;
            }

            const eventMatch = body.match(/EVENT:\s*(.+)/);
            const eventId = eventMatch ? eventMatch[1].trim() : 'default';

            core.setOutput('student_id', studentId);
            core.setOutput('student_email', emailMatch[1].trim());
            core.setOutput('event_id', eventId);

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get APIM subscription key
        id: key
        run: |
          SID="sub-student-${{ steps.parse.outputs.student_id }}"
          KEYS=$(az rest --method POST \
            --url "https://management.azure.com/subscriptions/08bfa8d7-3cb6-42d6-8214-18e784777a56/resourceGroups/rg-eduelden-hub/providers/Microsoft.ApiManagement/service/apim-eduelden-ai-v2/subscriptions/${SID}/listSecrets?api-version=2024-05-01" \
            --output json)
          PK=$(echo "$KEYS" | jq -r '.primaryKey')
          echo "::add-mask::$PK"
          echo "primary_key=$PK" >> "$GITHUB_OUTPUT"

      # 동시 신청으로 API가 이 이슈를 rejected 처리했다면 메일 발송/완료 처리를 건너뜀
      - name: Check issue is still active
        id: active
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const rejected = data.labels.some(l => (l.name || l) === 'rejected');
            core.setOutput('skip', rejected ? 'true' : 'false');
            if (rejected) core.notice('이슈가 rejected 상태여서 메일 발송을 건너뜁니다.');

      - name: Send welcome email via ACS Email
        if: steps.active.outputs.skip != 'true'
        env:
          ACS_CONNECTION_STRING: ${{ secrets.ACS_CONNECTION_STRING }}
          ACS_SENDER_ADDRESS: ${{ secrets.ACS_SENDER_ADDRESS }}
          STUDENT_EMAIL: ${{ steps.parse.outputs.student_email }}
          STUDENT_ID: ${{ steps.parse.outputs.student_id }}
          API_KEY: ${{ steps.key.outputs.primary_key }}
          EVENT_ID: ${{ steps.parse.outputs.event_id }}
        run: node emails/send.js

      - name: Comment on issue
        if: steps.active.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const eventId = '${{ steps.parse.outputs.event_id }}';
            const eventLabels = {
              'powerbi-mcp-20260530': ' (Power BI Workshop)',
              'kimi-copilot-20261107-gwangju': ' (AI 바이브코딩 워크숍 - 광주)',
            };
            const eventLabel = eventLabels[eventId] || '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ 온보딩 완료!${eventLabel}\n\n- 학생 번호: ${{ steps.parse.outputs.student_id }}\n- 이메일 발송: ${{ steps.parse.outputs.student_email }}\n- APIM 구독: sub-student-${{ steps.parse.outputs.student_id }}\n- 이벤트: ${eventId}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['onboarding', 'done']
            });
