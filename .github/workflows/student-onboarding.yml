name: Student Onboarding

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  onboard:
    if: contains(github.event.issue.labels.*.name, 'onboarding')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify passcode and parse student info
        id: parse
        env:
          CLASS_PASSCODE: ${{ secrets.CLASS_PASSCODE }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            // 구조화된 필드 파싱 (프론트엔드에서 전송)
            const passcodeMatch = body.match(/PASSCODE:\s*(.+)/);
            const idMatch = body.match(/STUDENT_ID:\s*(\d{2})/);
            const emailMatch = body.match(/EMAIL:\s*([\w.+-]+@[\w.-]+\.\w+)/);

            const submitted = passcodeMatch ? passcodeMatch[1].trim() : '';
            if (!submitted || submitted !== process.env.CLASS_PASSCODE) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 패스코드가 올바르지 않습니다.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('패스코드 불일치');
              return;
            }

            if (!idMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 학생 번호(01~50)를 확인해주세요.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('학생 번호 없음');
              return;
            }

            const studentId = idMatch[1];
            const num = parseInt(studentId);
            if (num < 1 || num > 50) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 학생 번호는 01~50 사이여야 합니다.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('학생 번호 범위 초과');
              return;
            }

            if (!emailMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 유효한 이메일 주소를 입력해주세요.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('이메일 없음');
              return;
            }

            core.setOutput('student_id', studentId);
            core.setOutput('student_email', emailMatch[1].trim());

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get APIM subscription key
        id: key
        run: |
          SID="sub-student-${{ steps.parse.outputs.student_id }}"
          KEYS=$(az rest --method POST \
            --url "https://management.azure.com/subscriptions/3354f2f5-e261-49af-9ead-2c6938f447a3/resourceGroups/rg-powerplatform-billing/providers/Microsoft.ApiManagement/service/apim-eduelden-ai/subscriptions/${SID}/listSecrets?api-version=2022-08-01" \
            --output json)
          PK=$(echo "$KEYS" | jq -r '.primaryKey')
          echo "::add-mask::$PK"
          echo "primary_key=$PK" >> "$GITHUB_OUTPUT"

      - name: Send welcome email via ACS Email
        uses: actions/github-script@v7
        env:
          ACS_CONNECTION_STRING: ${{ secrets.ACS_CONNECTION_STRING }}
          ACS_SENDER_ADDRESS: ${{ secrets.ACS_SENDER_ADDRESS }}
        with:
          script: |
            const crypto = require('crypto');
            const studentEmail = '${{ steps.parse.outputs.student_email }}';
            const studentId = '${{ steps.parse.outputs.student_id }}';
            const apiKey = '${{ steps.key.outputs.primary_key }}';
            const apimUrl = 'https://apim-eduelden-ai.azure-api.net';
            const azAccount = `${studentId}@eduelden.kr`;
            const azPassword = '!!ed7788';

            const html = `<div style="font-family:Pretendard,sans-serif;max-width:640px;margin:auto">
              <h2 style="color:#1a56db">🚀 Azure AI Foundry 바이브코딩 실습</h2>
              <p>안녕하세요, <b>${studentId}번</b> 학생!</p><hr/>
              <h3>👤 Azure 계정 정보</h3>
              <table border="1" cellpadding="8" style="border-collapse:collapse;width:100%">
                <tr style="background:#f0f7ff"><td><b>계정</b></td><td><code>${azAccount}</code></td></tr>
                <tr><td><b>초기 비밀번호</b></td><td><code>${azPassword}</code></td></tr>
              </table>
              <p style="color:#dc2626;font-size:0.9em">⚠️ 첫 로그인 시 비밀번호를 변경해야 합니다.</p>
              <h3>🔑 API 설정 정보</h3>
              <table border="1" cellpadding="8" style="border-collapse:collapse;width:100%">
                <tr style="background:#f0fdf4"><td><b>Base URL</b></td><td><code>${apimUrl}/openai/v1</code></td></tr>
                <tr><td><b>API Key</b></td><td><code>${apiKey}</code></td></tr>
                <tr><td><b>기본 모델</b></td><td><code>gpt-54-mini</code></td></tr>
              </table>
              <h3>⚡ 자동 설정 (권장)</h3>
              <p>PowerShell을 <b>관리자 모드</b>로 열고 아래 복사-붙여넣기:</p>
              <pre style="background:#1e293b;color:#e2e8f0;padding:12px;border-radius:8px;overflow-x:auto">powershell -ExecutionPolicy Bypass -Command ". ./setup-student.ps1 -StudentId ${studentId} -ApiKey '${apiKey}'"</pre>
              <h3>🔄 모델 변경</h3>
              <table border="1" cellpadding="6" style="border-collapse:collapse;width:100%">
                <tr style="background:#f8fafc"><th>모델</th><th>Model ID</th><th>특징</th></tr>
                <tr><td>GPT-5.4-mini</td><td><code>gpt-54-mini</code></td><td>범용, 빠름 ⭐기본</td></tr>
                <tr><td>GPT-5.5</td><td><code>gpt-55</code></td><td>고품질, 느림</td></tr>
                <tr><td>DeepSeek</td><td><code>deepseek-v4-flash</code></td><td>대안 모델</td></tr>
              </table></div>`;

            // Parse ACS connection string
            const connStr = process.env.ACS_CONNECTION_STRING;
            const endpoint = connStr.match(/endpoint=([^;]+)/)[1].replace(/\/$/, '');
            const accessKey = connStr.match(/accesskey=(.*)/)[1];
            const host = endpoint.replace('https://', '');
            const sender = process.env.ACS_SENDER_ADDRESS;

            const body = JSON.stringify({
              senderAddress: sender,
              content: { subject: `[AI 실습] 학생 ${studentId}번 환경 설정 안내`, html },
              recipients: { to: [{ address: studentEmail }] }
            });

            // HMAC-SHA256 auth
            const url = new URL(`${endpoint}/emails:send?api-version=2023-03-31`);
            const dateStr = new Date().toUTCString();
            const contentHash = crypto.createHash('sha256').update(body).digest('base64');
            const pathAndQuery = url.pathname + url.search;
            const stringToSign = `POST\n${pathAndQuery}\n${dateStr};${host};${contentHash}`;
            const signature = crypto.createHmac('sha256', Buffer.from(accessKey, 'base64'))
              .update(stringToSign).digest('base64');

            const resp = await fetch(url.toString(), {
              method: 'POST',
              headers: {
                'x-ms-date': dateStr,
                'x-ms-content-sha256': contentHash,
                'Authorization': `HMAC-SHA256 SignedHeaders=x-ms-date;host;x-ms-content-sha256&Signature=${signature}`,
                'Content-Type': 'application/json',
                'repeatability-request-id': crypto.randomUUID(),
                'repeatability-first-sent': dateStr
              },
              body
            });

            const result = await resp.text();
            console.log(`ACS Email response: HTTP ${resp.status}`);
            console.log(result);
            if (resp.status !== 202) {
              core.setFailed(`Email send failed: HTTP ${resp.status} - ${result}`);
            } else {
              console.log(`Email sent to ${studentEmail} via ACS`);
            }

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ 온보딩 완료!\n\n- 학생 번호: ${{ steps.parse.outputs.student_id }}\n- 이메일 발송: ${{ steps.parse.outputs.student_email }}\n- Azure 계정: ${{ steps.parse.outputs.student_id }}@eduelden.kr\n- APIM 구독: sub-student-${{ steps.parse.outputs.student_id }}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['onboarding', 'done']
            });
