name: Student Onboarding

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  onboard:
    if: contains(github.event.issue.labels.*.name, 'onboarding')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify passcode and parse student info
        id: parse
        env:
          CLASS_PASSCODE: ${{ secrets.CLASS_PASSCODE }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            // 패스코드 검증
            const passcodeMatch = body.match(/수업\s*패스코드[\s\S]*?\n\s*(.+)/);
            const submitted = passcodeMatch ? passcodeMatch[1].trim() : '';
            if (!submitted || submitted !== process.env.CLASS_PASSCODE) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 패스코드가 올바르지 않습니다. 강사에게 확인 후 다시 신청해주세요.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('패스코드 불일치');
              return;
            }

            // 학생 번호 파싱
            const idMatch = body.match(/학생\s*번호[\s\S]*?\n\s*(\d{2})/);
            if (!idMatch) {
              core.setFailed('학생 번호를 찾을 수 없습니다');
              return;
            }

            // 이메일 파싱 (도메인 제한 없음 — 학생 개인 이메일 허용)
            const emailMatch = body.match(/이메일[\s\S]*?\n\s*([\w.+-]+@[\w-]+\.[\w.]+)/);
            let email = emailMatch ? emailMatch[1].trim() : `${idMatch[1]}@eduelden.kr`;

            core.setOutput('student_id', idMatch[1]);
            core.setOutput('student_email', email);

      - name: Get APIM subscription key
        id: key
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "$AZURE_CREDENTIALS" | az login --service-principal \
            --username $(echo "$AZURE_CREDENTIALS" | jq -r .clientId) \
            --password $(echo "$AZURE_CREDENTIALS" | jq -r .clientSecret) \
            --tenant $(echo "$AZURE_CREDENTIALS" | jq -r .tenantId)

          SID="sub-student-${{ steps.parse.outputs.student_id }}"
          KEYS=$(az apim subscription keys list \
            --resource-group rg-powerplatform-billing \
            --service-name apim-eduelden-ai \
            --subscription-id "$SID" \
            --output json)
          PK=$(echo "$KEYS" | jq -r '.primaryKey')
          echo "::add-mask::$PK"
          echo "primary_key=$PK" >> "$GITHUB_OUTPUT"

      - name: Send welcome email via Graph API
        env:
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          TOKEN=$(curl -s -X POST \
            "https://login.microsoftonline.com/$GRAPH_TENANT_ID/oauth2/v2.0/token" \
            -d "client_id=$GRAPH_CLIENT_ID" \
            -d "client_secret=$GRAPH_CLIENT_SECRET" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials" | jq -r '.access_token')

          STUDENT_EMAIL="${{ steps.parse.outputs.student_email }}"
          STUDENT_ID="${{ steps.parse.outputs.student_id }}"
          API_KEY="${{ steps.key.outputs.primary_key }}"
          APIM_URL="https://apim-eduelden-ai.azure-api.net"

          cat > /tmp/email.json << EMAILEOF
          {
            "message": {
              "subject": "[AI 실습] 학생 ${STUDENT_ID}번 환경 설정 안내",
              "body": {
                "contentType": "HTML",
                "content": "<h2>Azure AI Foundry 바이브코딩 실습</h2><p>안녕하세요, ${STUDENT_ID}번 학생!</p><hr/><h3>🔑 API 설정 정보</h3><table border='1' cellpadding='8' style='border-collapse:collapse'><tr><td><b>Base URL</b></td><td><code>${APIM_URL}/openai/v1</code></td></tr><tr><td><b>API Key</b></td><td><code>${API_KEY}</code></td></tr><tr><td><b>기본 모델</b></td><td><code>gpt-54-mini</code></td></tr></table><br/><h3>⚡ 자동 설정 (권장)</h3><p>PowerShell을 <b>관리자 모드</b>로 열고 아래 명령어를 복사-붙여넣기:</p><pre style='background:#f0f0f0;padding:12px;border-radius:6px'>powershell -ExecutionPolicy Bypass -Command \"&amp; { .\\setup-student.ps1 -StudentId ${STUDENT_ID} -ApiKey '${API_KEY}' }\"</pre><p>이 스크립트가 자동으로:</p><ul><li>✅ VS Code + Cline 확장 설치</li><li>✅ Cline에 API 설정 자동 주입 (Base URL + 키 + 모델)</li><li>✅ 연결 테스트까지 완료</li></ul><p>실행 후 VS Code를 재시작하면 Cline이 바로 작동합니다.</p><hr/><h3>🔄 모델 변경 방법</h3><p>Cline 설정에서 Model ID만 바꾸면 됩니다 (키는 동일):</p><table border='1' cellpadding='6' style='border-collapse:collapse'><tr><th>모델</th><th>Model ID</th><th>특징</th></tr><tr><td>GPT-5.4-mini</td><td><code>gpt-54-mini</code></td><td>범용, 빠름 ⭐기본</td></tr><tr><td>GPT-5.5</td><td><code>gpt-55</code></td><td>고품질, 느림</td></tr><tr><td>DeepSeek</td><td><code>deepseek-v4-flash</code></td><td>대안 모델</td></tr></table><hr/><h3>🛠 수동 설정 (스크립트가 안 될 경우)</h3><ol><li>VS Code 설치 → Extensions에서 <b>Cline</b> 검색 후 설치</li><li>Cline 설정 → API Provider: <b>OpenAI Compatible</b></li><li>Base URL: <code>${APIM_URL}/openai/v1</code></li><li>API Key: 위 표의 키 입력</li><li>Model: <code>gpt-54-mini</code></li></ol>"
              },
              "toRecipients": [{"emailAddress": {"address": "${STUDENT_EMAIL}"}}]
            }
          }
          EMAILEOF

          curl -s -X POST \
            "https://graph.microsoft.com/v1.0/users/$SENDER_EMAIL/sendMail" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/email.json

          echo "Email sent to $STUDENT_EMAIL"

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ 온보딩 완료!\n\n- 학생 번호: ${{ steps.parse.outputs.student_id }}\n- 이메일 발송: ${{ steps.parse.outputs.student_email }}\n- APIM 구독: sub-student-${{ steps.parse.outputs.student_id }}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['onboarding', 'done']
            });
