name: Student Onboarding

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  onboard:
    if: contains(github.event.issue.labels.*.name, 'onboarding')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify passcode and parse student info
        id: parse
        env:
          CLASS_PASSCODE: ${{ secrets.CLASS_PASSCODE }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            // 구조화된 필드 파싱 (프론트엔드에서 전송)
            const passcodeMatch = body.match(/PASSCODE:\s*(.+)/);
            const idMatch = body.match(/STUDENT_ID:\s*(\d{2})/);
            const emailMatch = body.match(/EMAIL:\s*([\w.+-]+@[\w.-]+\.\w+)/);

            const submitted = passcodeMatch ? passcodeMatch[1].trim() : '';
            if (!submitted || submitted !== process.env.CLASS_PASSCODE) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 패스코드가 올바르지 않습니다.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('패스코드 불일치');
              return;
            }

            if (!idMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 학생 번호(01~50)를 확인해주세요.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('학생 번호 없음');
              return;
            }

            const studentId = idMatch[1];
            const num = parseInt(studentId);
            if (num < 1 || num > 50) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 학생 번호는 01~50 사이여야 합니다.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('학생 번호 범위 초과');
              return;
            }

            if (!emailMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ 유효한 이메일 주소를 입력해주세요.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                labels: ['onboarding', 'rejected']
              });
              core.setFailed('이메일 없음');
              return;
            }

            core.setOutput('student_id', studentId);
            core.setOutput('student_email', emailMatch[1].trim());

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get APIM subscription key
        id: key
        run: |
          SID="sub-student-${{ steps.parse.outputs.student_id }}"
          KEYS=$(az rest --method POST \
            --url "https://management.azure.com/subscriptions/3354f2f5-e261-49af-9ead-2c6938f447a3/resourceGroups/rg-powerplatform-billing/providers/Microsoft.ApiManagement/service/apim-eduelden-ai/subscriptions/${SID}/listSecrets?api-version=2022-08-01" \
            --output json)
          PK=$(echo "$KEYS" | jq -r '.primaryKey')
          echo "::add-mask::$PK"
          echo "primary_key=$PK" >> "$GITHUB_OUTPUT"

      - name: Send welcome email via ACS Email
        uses: actions/github-script@v7
        env:
          ACS_CONNECTION_STRING: ${{ secrets.ACS_CONNECTION_STRING }}
          ACS_SENDER_ADDRESS: ${{ secrets.ACS_SENDER_ADDRESS }}
        with:
          script: |
            const crypto = require('crypto');
            const studentEmail = '${{ steps.parse.outputs.student_email }}';
            const studentId = '${{ steps.parse.outputs.student_id }}';
            const apiKey = '${{ steps.key.outputs.primary_key }}';
            const apimUrl = 'https://apim-eduelden-ai.azure-api.net';
            const azAccount = `${studentId}@eduelden.kr`;
            const azPassword = '!!ed7788';

            const scriptUrl = 'https://raw.githubusercontent.com/asomi7007/eduelden-ai-deploy/main/scripts/setup-student.ps1';
            const tbl = 'border="1" cellpadding="8" style="border-collapse:collapse;width:100%"';
            const code = (t) => `<code style="background:#f1f5f9;padding:2px 6px;border-radius:4px">${t}</code>`;
            const pre = (t) => `<pre style="background:#1e293b;color:#e2e8f0;padding:12px;border-radius:8px;overflow-x:auto;font-size:13px">${t}</pre>`;

            const html = `<div style="font-family:'Segoe UI',Pretendard,sans-serif;max-width:680px;margin:auto;color:#1e293b">
            <div style="background:linear-gradient(135deg,#1a56db,#7c3aed);padding:24px;border-radius:12px 12px 0 0;text-align:center">
              <h1 style="color:#fff;margin:0;font-size:22px">🚀 Azure AI Foundry 바이브코딩 실습</h1>
              <p style="color:#e0e7ff;margin:8px 0 0;font-size:14px">VS Code + Cline으로 AI 바이브코딩을 시작하세요!</p>
            </div>
            <div style="padding:24px;background:#fff;border:1px solid #e2e8f0;border-top:none;border-radius:0 0 12px 12px">

            <p>안녕하세요, <b>${studentId}번</b> 학생! 실습 환경 설정에 필요한 모든 정보입니다.</p>

            <h2 style="color:#1a56db;border-bottom:2px solid #1a56db;padding-bottom:6px">📋 내 정보</h2>
            <table ${tbl}>
              <tr style="background:#f0f7ff"><td style="width:140px"><b>Azure 계정</b></td><td>${code(azAccount)}</td></tr>
              <tr><td><b>초기 비밀번호</b></td><td>${code(azPassword)}</td></tr>
              <tr style="background:#f0fdf4"><td><b>API Base URL</b></td><td>${code(apimUrl + '/openai/v1')}</td></tr>
              <tr><td><b>API Key</b></td><td>${code(apiKey)}</td></tr>
              <tr style="background:#f0f7ff"><td><b>기본 모델</b></td><td>${code('gpt-54-mini')}</td></tr>
            </table>
            <p style="color:#dc2626;font-size:0.9em">⚠️ Azure 첫 로그인 시 비밀번호를 반드시 변경해야 합니다.</p>

            <hr style="border:none;border-top:1px solid #e2e8f0;margin:24px 0"/>

            <h2 style="color:#16a34a;border-bottom:2px solid #16a34a;padding-bottom:6px">⚡ 방법 1: 자동 설정 (권장)</h2>
            <p>아래 스크립트가 <b>VS Code 설치 → Cline 확장 설치 → API 설정 → 연결 테스트</b>까지 한번에 처리합니다.</p>

            <p><b>Step 1.</b> 설정 스크립트 다운로드</p>
            <p>👉 <a href="${scriptUrl}" style="color:#1a56db;font-weight:bold">setup-student.ps1 다운로드 링크</a></p>
            <p style="color:#6b7280;font-size:0.85em">※ 브라우저가 차단하면: 링크 우클릭 → "다른 이름으로 링크 저장" 또는 아래 PowerShell 명령으로 직접 다운로드</p>
            ${pre('Invoke-WebRequest -Uri "' + scriptUrl + '" -OutFile setup-student.ps1')}

            <p><b>Step 2.</b> PowerShell을 <b style="color:#dc2626">관리자 모드</b>로 열고, 다운로드한 폴더에서 실행</p>
            ${pre('Set-ExecutionPolicy Bypass -Scope Process -Force\n.\\setup-student.ps1 -StudentId ' + studentId + ' -ApiKey "' + apiKey + '"')}

            <p><b>자동 설정이 하는 일:</b></p>
            <ul style="line-height:1.8">
              <li>✅ VS Code가 없으면 자동 설치</li>
              <li>✅ Cline 확장(saoudrizwan.claude-dev)이 없으면 자동 설치</li>
              <li>✅ Cline에 API Base URL, Key, 기본 모델(gpt-54-mini) 자동 구성</li>
              <li>✅ 3개 모델 설정 파일 생성 (<code>~/.ai-class/config.json</code>)</li>
              <li>✅ API 연결 테스트 (GPT-5.4-mini에 "Hello" 전송)</li>
            </ul>
            <p><b>자동 구성되는 모델 3개:</b></p>
            <table ${tbl}>
              <tr style="background:#f8fafc"><th>모델</th><th>Model ID</th><th>Base URL</th></tr>
              <tr><td>GPT-5.4-mini ⭐기본</td><td>${code('gpt-54-mini')}</td><td>${code(apimUrl + '/openai')}</td></tr>
              <tr><td>GPT-5.5</td><td>${code('gpt-55')}</td><td>${code(apimUrl + '/openai')}</td></tr>
              <tr><td>DeepSeek V4</td><td>${code('deepseek-v4-flash')}</td><td>${code(apimUrl + '/deepseek')}</td></tr>
            </table>
            <p style="color:#6b7280;font-size:0.85em">※ Cline 기본값은 gpt-54-mini로 설정됩니다. 모델 변경은 아래 "모델 변경" 섹션 참고.</p>

            <hr style="border:none;border-top:1px solid #e2e8f0;margin:24px 0"/>

            <h2 style="color:#7c3aed;border-bottom:2px solid #7c3aed;padding-bottom:6px">🔧 방법 2: 수동 설정</h2>
            <p>자동 설정이 안 될 경우 아래 순서로 직접 설정하세요.</p>

            <h3>① VS Code 설치</h3>
            <p><a href="https://code.visualstudio.com/download" style="color:#1a56db">https://code.visualstudio.com/download</a> 에서 Windows 64bit 버전 다운로드 후 설치</p>

            <h3>② Cline 확장 설치</h3>
            <ol style="line-height:1.8">
              <li>VS Code 실행</li>
              <li>왼쪽 사이드바에서 <b>확장(Extensions)</b> 아이콘 클릭 (또는 ${code('Ctrl+Shift+X')})</li>
              <li>검색창에 ${code('Cline')} 입력</li>
              <li><b>Cline</b> (saoudrizwan.claude-dev) 설치</li>
            </ol>

            <h3>③ Cline API 설정 (기본 모델: GPT-5.4-mini)</h3>
            <ol style="line-height:1.8">
              <li>왼쪽 사이드바에서 <b>Cline</b> 아이콘 클릭</li>
              <li>설정(⚙️) 열기</li>
              <li><b>API Provider</b>: ${code('OpenAI Compatible')} 선택</li>
              <li><b>Base URL</b>: ${code(apimUrl + '/openai/v1')}</li>
              <li><b>API Key</b>: ${code(apiKey)}</li>
              <li><b>Model ID</b>: ${code('gpt-54-mini')}</li>
            </ol>

            <h3>④ 테스트</h3>
            <p>Cline 채팅창에 <b>"안녕하세요"</b> 입력 → AI 응답이 오면 설정 완료!</p>

            <h3>⑤ 다른 모델 사용하기</h3>
            <p>Cline 설정에서 <b>Base URL</b>과 <b>Model ID</b>를 아래 값으로 변경하면 됩니다. <b>API Key는 동일</b>합니다.</p>
            <table ${tbl}>
              <tr style="background:#f8fafc"><th>모델</th><th>Base URL</th><th>Model ID</th></tr>
              <tr style="background:#f0fdf4"><td><b>GPT-5.4-mini</b> ⭐기본</td><td>${code(apimUrl + '/openai/v1')}</td><td>${code('gpt-54-mini')}</td></tr>
              <tr><td><b>GPT-5.5</b> (고품질)</td><td>${code(apimUrl + '/openai/v1')}</td><td>${code('gpt-55')}</td></tr>
              <tr style="background:#f0f7ff"><td><b>DeepSeek V4</b></td><td>${code(apimUrl + '/deepseek/v1')}</td><td>${code('deepseek-v4-flash')}</td></tr>
            </table>
            <p style="color:#6b7280;font-size:0.85em">※ GPT 모델과 DeepSeek 모델은 <b>Base URL이 다릅니다</b> (/openai vs /deepseek). 변경 시 주의!</p>

            <hr style="border:none;border-top:1px solid #e2e8f0;margin:24px 0"/>

            <h2 style="color:#0891b2;border-bottom:2px solid #0891b2;padding-bottom:6px">🔄 사용 가능한 모델</h2>
            <p>Cline 설정에서 <b>Model ID</b>만 바꾸면 모델 전환 가능 (API Key는 동일)</p>
            <table ${tbl}>
              <tr style="background:#f8fafc"><th>모델</th><th>Model ID</th><th>특징</th></tr>
              <tr><td>GPT-5.4-mini</td><td>${code('gpt-54-mini')}</td><td>범용, 빠름 ⭐ <b>기본</b></td></tr>
              <tr><td>GPT-5.5</td><td>${code('gpt-55')}</td><td>고품질, 느림 (복잡한 작업용)</td></tr>
              <tr><td>DeepSeek V4</td><td>${code('deepseek-v4-flash')}</td><td>대안 모델</td></tr>
            </table>

            <div style="background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:12px;margin-top:20px">
              <b>💡 문제가 있나요?</b><br/>
              강사에게 문의하거나 온보딩 페이지에서 취소/재신청할 수 있습니다.
            </div>

            </div></div>`;

            // Parse ACS connection string
            const connStr = process.env.ACS_CONNECTION_STRING;
            const endpoint = connStr.match(/endpoint=([^;]+)/)[1].replace(/\/$/, '');
            const accessKey = connStr.match(/accesskey=(.*)/)[1];
            const host = endpoint.replace('https://', '');
            const sender = process.env.ACS_SENDER_ADDRESS;

            const body = JSON.stringify({
              senderAddress: sender,
              content: { subject: `[AI 실습] 학생 ${studentId}번 환경 설정 안내`, html },
              recipients: { to: [{ address: studentEmail }] }
            });

            // HMAC-SHA256 auth
            const url = new URL(`${endpoint}/emails:send?api-version=2023-03-31`);
            const dateStr = new Date().toUTCString();
            const contentHash = crypto.createHash('sha256').update(body).digest('base64');
            const pathAndQuery = url.pathname + url.search;
            const stringToSign = `POST\n${pathAndQuery}\n${dateStr};${host};${contentHash}`;
            const signature = crypto.createHmac('sha256', Buffer.from(accessKey, 'base64'))
              .update(stringToSign).digest('base64');

            const resp = await fetch(url.toString(), {
              method: 'POST',
              headers: {
                'x-ms-date': dateStr,
                'x-ms-content-sha256': contentHash,
                'Authorization': `HMAC-SHA256 SignedHeaders=x-ms-date;host;x-ms-content-sha256&Signature=${signature}`,
                'Content-Type': 'application/json',
                'repeatability-request-id': crypto.randomUUID(),
                'repeatability-first-sent': dateStr
              },
              body
            });

            const result = await resp.text();
            console.log(`ACS Email response: HTTP ${resp.status}`);
            console.log(result);
            if (resp.status !== 202) {
              core.setFailed(`Email send failed: HTTP ${resp.status} - ${result}`);
            } else {
              console.log(`Email sent to ${studentEmail} via ACS`);
            }

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ 온보딩 완료!\n\n- 학생 번호: ${{ steps.parse.outputs.student_id }}\n- 이메일 발송: ${{ steps.parse.outputs.student_email }}\n- Azure 계정: ${{ steps.parse.outputs.student_id }}@eduelden.kr\n- APIM 구독: sub-student-${{ steps.parse.outputs.student_id }}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['onboarding', 'done']
            });
